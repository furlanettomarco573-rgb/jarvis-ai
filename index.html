<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090d18">
  <meta name="description" content="Jarvis AI, il tuo assistente personale.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <title>Jarvis AI</title>
</head>
<body>
  <header class="app-header">
    <div class="logo" aria-hidden="true">J</div>
    <div>
      <h1>JARVIS AI</h1>
      <p>Il tuo assistente personale</p>
    </div>
  </header>

  <main class="app-main">
    <section class="welcome" id="welcome" aria-labelledby="welcome-title">
      <h2 id="welcome-title">Ciao! Sono Jarvis.</h2>
      <p>Da dove vuoi iniziare? Scrivimi un messaggio oppure prova una funzione.</p>
      <div class="quick-actions" aria-label="Azioni rapide">
        <button type="button" data-suggestion="Aiutami a organizzare la giornata">📅 Organizza la giornata</button>
        <button type="button" data-suggestion="Apri WhatsApp">💬 WhatsApp</button>
        <button type="button" data-suggestion="Voglio cercare qualcosa su internet">🔎 Cerca su internet</button>
        <button type="button" data-suggestion="Voglio usare il microfono">🎙️ Voce</button>
      </div>
    </section>

    <section id="chat" class="chat" aria-live="polite" aria-label="Conversazione con Jarvis"></section>
  </main>

  <div class="composer-shell">
    <form id="form" class="composer" novalidate>
      <label class="sr-only" for="message">Messaggio per Jarvis</label>
      <input id="message" name="message" placeholder="Scrivi a Jarvis..." autocomplete="off" enterkeyhint="send">
      <button type="button" id="mic" class="icon-button" title="Detta un messaggio" aria-label="Detta un messaggio">🎙️</button>
      <button type="submit" class="send-button" title="Invia messaggio" aria-label="Invia messaggio">➤</button>
    </form>
    <div id="status" class="status" role="status" aria-live="polite">Jarvis AI • Versione iniziale</div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
