

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090d18">
<title>Jarvis AI</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#090d18;color:#f4f6ff;
  font-family:Arial,sans-serif;min-height:100vh;
  display:flex;flex-direction:column
}
header{
  padding:22px 18px;border-bottom:1px solid #242b3c;
  display:flex;align-items:center;gap:12px
}
.logo{
  width:42px;height:42px;border-radius:14px;
  display:grid;place-items:center;background:#536dfe;
  font-size:22px;font-weight:bold
}
header h1{font-size:20px;margin:0}
header p{margin:4px 0 0;color:#9ca8c5;font-size:12px}
main{
  flex:1;width:100%;max-width:760px;margin:auto;
  padding:22px 16px 120px
}
.welcome{text-align:center;margin:45px 0 30px}
.welcome h2{font-size:27px;margin-bottom:10px}
.welcome p{color:#9ca8c5;line-height:1.5}
.quick{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
  margin-top:25px
}
.quick button{
  background:#151d30;border:1px solid #29344d;
  color:white;border-radius:14px;padding:16px 10px;
  font-size:14px
}
#chat{display:flex;flex-direction:column;gap:14px}
.message{
  max-width:85%;padding:13px 15px;border-radius:16px;
  line-height:1.45;white-space:pre-wrap
}
.user{align-self:flex-end;background:#536dfe}
.jarvis{align-self:flex-start;background:#192338}
.composer{
  position:fixed;bottom:0;left:0;right:0;
  padding:14px;background:#090d18;
  border-top:1px solid #242b3c
}
form{
  max-width:760px;margin:auto;display:flex;gap:8px
}
input{
  min-width:0;flex:1;background:#151d30;
  border:1px solid #34415c;border-radius:14px;
  padding:15px;color:white;font-size:16px;outline:none
}
form button{
  border:0;border-radius:14px;padding:0 17px;
  background:#536dfe;color:white;font-size:18px
}
#mic{background:#26334d}
.small{
  text-align:center;color:#7886a5;font-size:11px;
  margin-top:9px
}
</style>
</head>
<body>
<header>
  <div class="logo">J</div>
  <div>
    <h1>JARVIS AI</h1>
    <p>Il tuo assistente personale</p>
  </div>
</header>

<main>
  <section class="welcome" id="welcome">
    <h2>Ciao! Sono Jarvis.</h2>
    <p>Da dove vuoi iniziare? Scrivimi un messaggio oppure prova una funzione.</p>
    <div class="quick">
      <button onclick="suggest('Aiutami a organizzare la giornata')">📅 Organizza la giornata</button>
      <button onclick="suggest('Apri WhatsApp')">💬 WhatsApp</button>
      <button onclick="suggest('Voglio cercare qualcosa su internet')">🔎 Cerca su internet</button>
      <button onclick="suggest('Voglio usare il microfono')">🎙️ Voce</button>
    </div>
  </section>
  <section id="chat"></section>
</main>

<div class="composer">
  <form id="form">
    <input id="message" placeholder="Scrivi a Jarvis..." autocomplete="off">
    <button type="button" id="mic" title="Detta un messaggio">🎙️</button>
    <button type="submit" title="Invia">➤</button>
  </form>
  <div class="small">Jarvis AI • Versione iniziale</div>
</div>

<script>
const form = document.getElementById("form");
const input = document.getElementById("message");
const chat = document.getElementById("chat");
const welcome = document.getElementById("welcome");

function addMessage(text, type){
  const item = document.createElement("div");
  item.className = "message " + type;
  item.textContent = text;
  chat.appendChild(item);
  window.scrollTo(0, document.body.scrollHeight);
}

function suggest(text){
  input.value = text;
  input.focus();
}

function reply(text){
  const t = text.toLowerCase();

  if(t.includes("whatsapp")){
    addMessage("Per aprire WhatsApp, premi qui sotto. L'app si aprirà e potrai scegliere tu a chi scrivere.", "jarvis");
    const a = document.createElement("a");
    a.href = "https://wa.me/";
    a.textContent = "Apri WhatsApp";
    a.target = "_blank";
    a.rel = "noopener";
    a.style.cssText = "display:inline-block;margin:8px 0;padding:12px 16px;background:#263b32;color:white;border-radius:12px;text-decoration:none";
    chat.appendChild(a);
  } else if(t.includes("internet") || t.includes("cercare") || t.includes("cerca")){
    addMessage("Puoi effettuare una ricerca su Google da qui:", "jarvis");
    const a = document.createElement("a");
    a.href = "https://www.google.com/";
    a.textContent = "Apri Google";
    a.target = "_blank";
    a.rel = "noopener";
    a.style.cssText = "display:inline-block;margin:8px 0;padding:12px 16px;background:#263b32;color:white;border-radius:12px;text-decoration:none";
    chat.appendChild(a);
  } else if(t.includes("microfono")){
    addMessage("Premi il pulsante 🎙️ vicino alla casella di testo e consenti l'accesso al microfono, se il browser lo richiede.", "jarvis");
  } else {
    addMessage("Ho ricevuto il tuo messaggio! La chat è pronta. Nel prossimo passaggio collegheremo un modello AI per permettermi di rispondere davvero alle tue domande.", "jarvis");
  }
}

form.addEventListener("submit", function(e){
  e.preventDefault();
  const text = input.value.trim();
  if(!text) return;
  welcome.style.display = "none";
  addMessage(text, "user");
  input.value = "";
  reply(text);
});

document.getElementById("mic").addEventListener("click", function(){
  const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!Speech){
    addMessage("Il riconoscimento vocale non è supportato da questo browser. Puoi comunque scrivere i messaggi.", "jarvis");
    welcome.style.display = "none";
    return;
  }
  const recognition = new Speech();
  recognition.lang = "it-IT";
  recognition.onresult = function(event){
    input.value = event.results[0][0].transcript;
    input.focus();
  };
  recognition.onerror = function(){
    addMessage("Non sono riuscito ad avviare il microfono. Controlla i permessi del browser.", "jarvis");
    welcome.style.display = "none";
  };
  recognition.start();
});
</script>
</body>
</html>
